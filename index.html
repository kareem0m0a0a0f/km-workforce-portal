<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b5d">
  <title>KM Workforce</title>
  <style>
    :root { color-scheme: light; --navy:#123b5d; --teal:#13836d; --ink:#172b3a; --muted:#617282; --line:#dce5eb; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; }
    body { display:flex; flex-direction:column; font-family:Tahoma,Arial,sans-serif; color:var(--ink); background:#f2f6f9; }
    header { display:flex; align-items:center; gap:12px; min-height:70px; padding:10px max(14px,calc((100vw - 1200px)/2)); color:#fff; background:linear-gradient(135deg,#123b5d,#176e78); }
    .brand-mark { display:grid; place-items:center; width:46px; height:46px; flex:0 0 46px; border-radius:12px; background:#fff; color:var(--navy); font-size:18px; font-weight:800; }
    .brand-title { font-size:19px; font-weight:800; }
    .brand-subtitle { margin-top:3px; font-size:11px; opacity:.85; }
    main { flex:1; min-height:0; }
    iframe { display:block; width:100%; height:100%; min-height:420px; border:0; background:#f2f6f9; }
    footer { padding:7px 12px; text-align:center; font-size:10px; color:var(--muted); background:#fff; border-top:1px solid var(--line); }
    .error { padding:20px; max-width:760px; margin:20px auto; line-height:1.8; }
    .error code { overflow-wrap:anywhere; }
    @media(max-width:480px){ header{min-height:60px;padding:8px 12px}.brand-mark{width:40px;height:40px;flex-basis:40px}.brand-title{font-size:17px}iframe{min-height:360px} }
  </style>
</head>
<body>
  <header>
    <div class="brand-mark" aria-hidden="true">KM</div>
    <div>
      <div class="brand-title">KM Workforce</div>
      <div class="brand-subtitle">نظام إدارة الحضور والانصراف</div>
    </div>
  </header>
  <main id="app">
    <div class="error" id="setupMessage">
      <strong>يلزم إعداد رابط التطبيق أولًا.</strong><br>
      افتح هذا الملف وابحث عن <code>PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE</code>، ثم استبدله برابط Web App المنشور الذي ينتهي بـ <code>/exec</code>.
    </div>
  </main>
  <footer>KM Workforce · نظام داخلي لإدارة الحضور والانصراف</footer>
  <script>
    // استبدل القيمة التالية برابط Web App المنشور، وينبغي أن ينتهي بـ /exec.
    const APP_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';

    // هذا الغلاف يوجّه إلى واجهة الموظف فقط. أبقِ لوحة الإدارة الحساسة على رابطها المباشر.
    if (APP_URL.startsWith('https://script.google.com/macros/s/') && APP_URL.endsWith('/exec')) {
      const frame = document.createElement('iframe');
      frame.title = 'KM Workforce — واجهة الموظف';
      frame.allow = 'geolocation';
      frame.referrerPolicy = 'strict-origin-when-cross-origin';
      frame.src = APP_URL + '?embed=1';
      document.getElementById('app').replaceChildren(frame);
    }
  </script>
</body>
</html>
